<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Q3DGStream pipeline: initial Gaussian scene and NTC updates, PQAT compression, saliency priorities, QUIC transport and NTC receiver">
